name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build contracts
        run: pnpm --filter @repo/contracts build

      - name: Prisma generate
        working-directory: backend
        env:
          DATABASE_URL: postgresql://app_user:app@localhost:5432/barbearia_dev?schema=public
        run: pnpm exec prisma generate

      - name: Typecheck
        env:
          DATABASE_URL: postgresql://app_user:app@localhost:5432/barbearia_dev?schema=public
        run: pnpm typecheck

      - name: Architecture boundaries
        run: pnpm arch:check

      - name: KeyManagement stub
        run: pnpm test:kms

      - name: Lint
        run: pnpm lint

      - name: Audit (high+)
        run: pnpm audit --audit-level=high

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  integration:
    name: Integration (migrate + RLS + M1)
    runs-on: ubuntu-latest
    needs: quality
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: barbearia_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d barbearia_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_MIGRATION_URL: postgresql://postgres:postgres@localhost:5432/barbearia_dev?schema=public
      DATABASE_URL: postgresql://app_user:app@localhost:5432/barbearia_dev?schema=public
      REDIS_URL: redis://localhost:6379
      APP_PUBLIC_URL: http://localhost:3000
      CORS_ORIGINS: http://localhost:3000
      STORAGE_ENDPOINT: http://localhost:9000
      STORAGE_BUCKET: barbearia-dev
      STORAGE_REGION: sa-east-1
      STORAGE_ACCESS_KEY: minioadmin
      STORAGE_SECRET_KEY: minioadmin
      MAIL_DSN: smtp://localhost:1025
      MAIL_FROM: noreply@localhost
      MESSAGING_PROVIDER: fake
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Ensure DB roles
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d barbearia_dev -f backend/scripts/ensure-db-roles.sql

      - name: Prisma generate + migrate
        working-directory: backend
        env:
          DATABASE_URL: ${{ env.DATABASE_MIGRATION_URL }}
        run: |
          pnpm exec prisma generate
          pnpm exec prisma migrate deploy

      - name: RLS isolation check
        working-directory: backend
        run: pnpm exec tsx scripts/check-rls.ts

      - name: Generate JWT keys
        run: |
          openssl genrsa -out /tmp/jwt-private.pem 2048
          openssl rsa -in /tmp/jwt-private.pem -pubout -out /tmp/jwt-public.pem
          {
            echo "JWT_PRIVATE_KEY=$(base64 -w0 /tmp/jwt-private.pem)"
            echo "JWT_PUBLIC_KEY=$(base64 -w0 /tmp/jwt-public.pem)"
          } >> "$GITHUB_ENV"

      - name: Seed
        working-directory: backend
        env:
          KEK_LOCAL_BASE64: YWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWE=
        run: pnpm db:seed

      - name: Identity core (signup/login/refresh)
        working-directory: backend
        env:
          KEK_LOCAL_BASE64: YWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWE=
        run: pnpm test:identity

      - name: M1 probe GET /locations/:id
        working-directory: backend
        env:
          KEK_LOCAL_BASE64: YWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWE=
        run: pnpm test:locations

      - name: Customers (E3 Must)
        working-directory: backend
        env:
          KEK_LOCAL_BASE64: YWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWE=
        run: pnpm test:customers

      - name: Scheduling domain (EXCLUDE + state machine)
        working-directory: backend
        env:
          KEK_LOCAL_BASE64: YWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWE=
        run: pnpm test:scheduling-domain

      - name: Scheduling (panel + public + concurrency)
        working-directory: backend
        env:
          KEK_LOCAL_BASE64: YWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWE=
        run: pnpm test:scheduling

      - name: Public booking S4 (smoke)
        working-directory: backend
        env:
          KEK_LOCAL_BASE64: YWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWE=
        run: pnpm test:public-booking

      - name: Unit + API (vitest)
        working-directory: backend
        env:
          KEK_LOCAL_BASE64: YWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWE=
        run: pnpm exec vitest run

      - name: Messaging (smoke S5)
        working-directory: backend
        env:
          KEK_LOCAL_BASE64: YWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWE=
        run: pnpm test:messaging

  e2e-s3:
    name: E2E S3 (agenda painel)
    runs-on: ubuntu-latest
    needs: quality
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: barbearia_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d barbearia_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_MIGRATION_URL: postgresql://postgres:postgres@localhost:5432/barbearia_dev?schema=public
      DATABASE_URL: postgresql://app_user:app@localhost:5432/barbearia_dev?schema=public
      REDIS_URL: redis://localhost:6379
      APP_PUBLIC_URL: http://localhost:3000
      CORS_ORIGINS: http://localhost:3000
      STORAGE_ENDPOINT: http://localhost:9000
      STORAGE_BUCKET: barbearia-dev
      STORAGE_REGION: sa-east-1
      STORAGE_ACCESS_KEY: minioadmin
      STORAGE_SECRET_KEY: minioadmin
      MAIL_DSN: smtp://localhost:1025
      MAIL_FROM: noreply@localhost
      MESSAGING_PROVIDER: fake
      NODE_ENV: test
      NEXT_PUBLIC_API_URL: http://localhost:3333
      API_URL: http://localhost:3333/api/v1
      KEK_LOCAL_BASE64: YWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWE=
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Ensure DB roles
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d barbearia_dev -f backend/scripts/ensure-db-roles.sql

      - name: Prisma generate + migrate
        working-directory: backend
        env:
          DATABASE_URL: ${{ env.DATABASE_MIGRATION_URL }}
        run: |
          pnpm exec prisma generate
          pnpm exec prisma migrate deploy

      - name: Generate JWT keys
        run: |
          openssl genrsa -out /tmp/jwt-private.pem 2048
          openssl rsa -in /tmp/jwt-private.pem -pubout -out /tmp/jwt-public.pem
          {
            echo "JWT_PRIVATE_KEY=$(base64 -w0 /tmp/jwt-private.pem)"
            echo "JWT_PUBLIC_KEY=$(base64 -w0 /tmp/jwt-public.pem)"
          } >> "$GITHUB_ENV"

      - name: Seed
        working-directory: backend
        run: pnpm db:seed

      - name: Build contracts
        run: pnpm --filter @repo/contracts build

      - name: Install Playwright Chromium
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium

      - name: Start stack and Playwright S3
        run: |
          pnpm --filter @repo/backend exec tsx src/server.ts > /tmp/api.log 2>&1 &
          pnpm --filter @repo/frontend exec next dev --turbopack --port 3000 > /tmp/web.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -sf http://localhost:3333/health >/dev/null; then break; fi
            if [ "$i" -eq 40 ]; then echo "API não subiu" >&2; tail -n 80 /tmp/api.log; exit 1; fi
            sleep 1
          done
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3000 >/dev/null; then break; fi
            if [ "$i" -eq 60 ]; then echo "Frontend não subiu" >&2; tail -n 80 /tmp/web.log; exit 1; fi
            sleep 1
          done
          pnpm test:e2e:s3

